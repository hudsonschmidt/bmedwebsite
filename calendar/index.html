<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events &amp; Meetings</title>
  <meta name="description" content="Club meetings, guest speakers, and socials for the Cal Poly Biomedical Engineering Pre-Medical Club.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="../styles.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- nav -->
  <nav class="navbar navbar-expand-lg bpm-nav sticky-top">
    <div class="container">
      <a class="navbar-brand" href="../">
        <img src="../assets/logo-mark.png" alt="BPM home" width="600" height="165">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="nav">
        <ul class="navbar-nav gap-lg-4">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="./">Calendar</a></li>
          <li class="nav-item"><a class="nav-link" href="../about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="../board">Board</a></li>
          <li class="nav-item"><a class="nav-link" href="../contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- main -->
  <main id="main" class="section-band">
    <div class="container">
      <h1 class="section-heading"><span>Events &amp; Meetings</span></h1>

      <p class="calendar-meta">Location of meetings: <span data-calendar-location>Cal Poly</span></p>

      <!-- events in assets/events.json -->
      <div class="calendar-paper" data-calendar>
        <div class="calendar-head">
          <h2 class="calendar-month" data-calendar-title aria-live="polite">&nbsp;</h2>

          <div class="calendar-nav">
            <button type="button" class="calendar-btn" data-calendar-prev aria-label="Previous month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <button type="button" class="calendar-btn calendar-btn--text" data-calendar-today>Today</button>
            <button type="button" class="calendar-btn" data-calendar-next aria-label="Next month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <div class="calendar-scroll">
          <table class="calendar-table">
            <caption class="visually-hidden">Club events for the selected month</caption>
            <thead>
              <tr>
                <th scope="col">Sunday</th>
                <th scope="col">Monday</th>
                <th scope="col">Tuesday</th>
                <th scope="col">Wednesday</th>
                <th scope="col">Thursday</th>
                <th scope="col">Friday</th>
                <th scope="col">Saturday</th>
              </tr>
            </thead>
            <tbody data-calendar-grid></tbody>
          </table>
        </div>

        <p class="calendar-note" data-calendar-note hidden></p>

        <!-- event types -->
        <ul class="calendar-legend">
          <li><span class="swatch event--meeting"></span>Meetings</li>
          <li><span class="swatch event--guest"></span>Guests</li>
          <li><span class="swatch event--social"></span>Social</li>
        </ul>

        <noscript>
          <p class="calendar-note">
            The calendar needs JavaScript to display. Get in touch through the
            <a href="../contact/">contact page</a> for upcoming meeting dates.
          </p>
        </noscript>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../assets/calendar.js" defer></script>
</body>
</html>
